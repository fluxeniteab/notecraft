[package]
name = "notecraft"
version = "0.2.1"
description = "NoteCraft desktop knowledge base"
authors = ["Fluxenite"]
edition = "2021"
license = "GPL-3.0-only"
default-run = "notecraft"

[lib]
name = "notecraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
walkdir = "2"
notify = "6"
zip = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
tantivy = "0.22"
ammonia = "4"
sha2 = "0.10"
dirs = "5"
base64 = "0.22"
chacha20poly1305 = "0.10"
argon2 = "0.5"
hex = "0.4"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"

[[bin]]
name = "notecraft"
path = "src/main.rs"

[[bin]]
name = "notecraft-cli"
path = "src/bin/notecraft.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
