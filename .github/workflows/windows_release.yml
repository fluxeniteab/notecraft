name: Windows Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the bundles to (leave empty to only upload artifacts)"
        required: false

env:
  CARGO_TERM_COLOR: always

jobs:
  windows_release:
    name: Build Windows release
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Azure Trusted Signing — see docs/SIGNING.md. Empty values mean the
      # installers are built unsigned.
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
      AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
      AZURE_CERTIFICATE_PROFILE: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Configure Trusted Signing
        if: env.AZURE_CODE_SIGNING_ACCOUNT != ''
        shell: bash
        run: |
          bun install -g trusted-signing-cli
          cat > signing.trusted.json <<JSON
          {
            "bundle": {
              "windows": {
                "signCommand": {
                  "cmd": "trusted-signing-cli",
                  "args": ["-e", "${AZURE_ENDPOINT}", "-a", "${AZURE_CODE_SIGNING_ACCOUNT}", "-c", "${AZURE_CERTIFICATE_PROFILE}", "%1"]
                }
              }
            }
          }
          JSON

      - name: Build signed installers
        if: env.AZURE_CODE_SIGNING_ACCOUNT != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bun run tauri build --bundles msi,nsis --config signing.trusted.json

      - name: Build installers (unsigned)
        if: env.AZURE_CODE_SIGNING_ACCOUNT == ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bun run tauri build --bundles msi,nsis

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: notecraft-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error
          retention-days: 30

      - name: VirusTotal scan
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VT_SCAN }}
        run: |
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/msi/*.msi src-tauri/target/release/bundle/nsis/*.exe)
          node .github/scripts/vt-scan.mjs "${files[@]}"

      - name: Attach bundles to the GitHub release
        if: github.ref_type == 'tag' || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --title "NoteCraft $RELEASE_TAG" \
              --notes "NoteCraft $RELEASE_TAG" \
              --verify-tag
          gh release upload "$RELEASE_TAG" \
            src-tauri/target/release/bundle/msi/*.msi \
            src-tauri/target/release/bundle/nsis/*.exe \
            src-tauri/target/release/bundle/nsis/*.nsis.zip \
            --clobber

      - name: Publish updater manifest
        if: github.ref_type == 'tag' || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          PLATFORM: windows-x86_64
        run: |
          shopt -s nullglob
          archives=(src-tauri/target/release/bundle/nsis/*.nsis.zip)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "No NSIS updater archive was produced" >&2
            exit 1
          fi
          ARTIFACT="${archives[0]}" node .github/scripts/updater-manifest.mjs
