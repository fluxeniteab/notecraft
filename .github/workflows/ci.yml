name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------
  # Tester: frontend gates plus the Rust unit suite and lints.
  # ---------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file pkg-config \
            libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck
      - name: Frontend lint
        run: bun run lint
      - name: Frontend tests
        run: bun run test
      - name: Frontend build
        run: bun run build

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Rust check
        working-directory: src-tauri
        run: cargo check --all-targets
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --all-targets
      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets

  # ---------------------------------------------------------------------
  # Builders: one packaged app per platform, uploaded as a workflow artifact.
  # ---------------------------------------------------------------------
  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: msi,nsis
            artifact: notecraft-windows
          - name: macos
            os: macos-latest
            bundles: app,dmg
            artifact: notecraft-macos
          - name: linux
            os: ubuntu-22.04
            bundles: deb,appimage
            artifact: notecraft-linux

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file pkg-config \
            libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Build app and bundles
        env:
          # Updater artifacts are produced by every build, so the signing key is
          # required here too.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bun run tauri build --bundles ${{ matrix.bundles }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release/bundle
          if-no-files-found: error
          retention-days: 30

      - name: VirusTotal scan
        if: github.event_name == 'push'
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VT_SCAN }}
        run: |
          shopt -s nullglob
          files=(
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          )
          node .github/scripts/vt-scan.mjs "${files[@]}"
