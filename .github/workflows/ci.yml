name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------
  # Formatting and lints run once, on Linux.
  # ---------------------------------------------------------------------
  lint:
    name: Format and clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux windowing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libxkbcommon-dev \
            libwayland-dev libx11-dev libxi-dev libxcursor-dev \
            libxrandr-dev libgl1-mesa-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # ---------------------------------------------------------------------
  # The test suite, on every platform we ship.
  # ---------------------------------------------------------------------
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux windowing dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libxkbcommon-dev \
            libwayland-dev libx11-dev libxi-dev libxcursor-dev \
            libxrandr-dev libgl1-mesa-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Type check (all targets)
        run: cargo check --all-targets

      - name: Tests
        run: cargo test --all-targets

      - name: Release build
        run: cargo build --release
