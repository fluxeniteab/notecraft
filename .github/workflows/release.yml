name: Release

# One-click release for the Tauri application.
#
# `workflow_dispatch` resolves the version (input, or `src-tauri/tauri.conf.json`),
# creates the tag if it does not exist, and then starts the three platform
# release workflows, which build the signed installers and attach them to the
# release for that tag. Pushing a `v*` tag yourself does the same thing without
# this workflow: each platform workflow already listens for tag pushes.
#
# Turn `publish` off to run the whole pipeline as a dry run: the platform
# workflows build and upload artifacts but no tag or release is created.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.4.0). Empty = the version in src-tauri/tauri.conf.json"
        required: false
        type: string
      publish:
        description: "Create the tag and publish the release"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

env:
  CARGO_TERM_COLOR: always

jobs:
  tag:
    name: Resolve version and start builds
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          requested="${{ inputs.version }}"
          if [ -z "$requested" ]; then
            requested=$(grep -m1 '"version"' src-tauri/tauri.conf.json \
              | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          fi
          case "$requested" in
            v*) tag="$requested" ;;
            *)  tag="v$requested" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved $tag (publish: ${{ inputs.publish }})"

      - name: Create the tag
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; the platform builds will attach to it."
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
            echo "Created tag $TAG at $GITHUB_SHA"
          fi

      - name: Start the platform release workflows
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          # `tag` empty means "build and upload artifacts only" to those workflows.
          target="$TAG"
          if [ "$PUBLISH" != "true" ]; then
            target=""
          fi
          for workflow in windows_release.yml macos_release.yml linux_release.yml; do
            gh workflow run "$workflow" --ref "$GITHUB_REF_NAME" -f tag="$target"
            echo "Started $workflow (tag: ${target:-none})"
          done

      - name: Summary
        shell: bash
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          {
            echo "### NoteCraft release ${TAG}"
            echo
            if [ "$PUBLISH" = "true" ]; then
              echo "Tag created and the three platform workflows started. Installers"
              echo "appear at <https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG>"
              echo "as each runner finishes."
            else
              echo "Dry run: no tag or release was created. Installers are attached to"
              echo "each platform workflow run as artifacts."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
