name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: notecraft-windows-x64.zip
          - os: ubuntu-22.04
            artifact: notecraft-linux-x64.tar.gz
          - os: macos-latest
            artifact: notecraft-macos-arm64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux windowing dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libxkbcommon-dev \
            libwayland-dev libx11-dev libxi-dev libxcursor-dev \
            libxrandr-dev libgl1-mesa-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          7z a -tzip "${{ matrix.artifact }}" ./target/release/notecraft.exe

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -czf "${{ matrix.artifact }}" -C target/release notecraft

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          tar -czf "${{ matrix.artifact }}" -C target/release notecraft

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
