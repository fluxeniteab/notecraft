name: macOS Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the bundles to (leave empty to only upload artifacts)"
        required: false

env:
  CARGO_TERM_COLOR: always

jobs:
  macos_release:
    name: Build macOS release
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      # Present only when the Developer ID certificate secret is configured;
      # an empty value would make the bundler attempt a bogus keychain import.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      # Signing and notarization activate automatically when the Apple secrets
      # exist (see docs/SIGNING.md). Without them the DMG is unsigned.
      - name: Build signed DMG
        if: env.APPLE_CERTIFICATE != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bun run tauri build --bundles app,dmg

      - name: Build DMG (unsigned)
        if: env.APPLE_CERTIFICATE == ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bun run tauri build --bundles app,dmg

      - name: Upload macOS bundles
        uses: actions/upload-artifact@v4
        with:
          name: notecraft-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 30

      - name: VirusTotal scan
        env:
          VT_API_KEY: ${{ secrets.VT_SCAN }}
        run: node .github/scripts/vt-scan.mjs src-tauri/target/release/bundle/dmg/*.dmg

      - name: Attach bundles to the GitHub release
        if: github.ref_type == 'tag' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --title "NoteCraft $RELEASE_TAG" \
              --notes "NoteCraft $RELEASE_TAG" \
              --verify-tag
          gh release upload "$RELEASE_TAG" \
            src-tauri/target/release/bundle/dmg/*.dmg \
            src-tauri/target/release/bundle/macos/*.app.tar.gz \
            --clobber

      - name: Publish updater manifest
        if: github.ref_type == 'tag' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          PLATFORM: darwin-aarch64
        run: |
          shopt -s nullglob
          archives=(src-tauri/target/release/bundle/macos/*.app.tar.gz)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "No macOS updater archive was produced" >&2
            exit 1
          fi
          ARTIFACT="${archives[0]}" node .github/scripts/updater-manifest.mjs
