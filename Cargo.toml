[package]
name = "notecraft"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Fluxenite <ahaduzzamankhan878@gmail.com>"]
description = "NoteCraft: a Rust-native, Obsidian-inspired Markdown knowledge base."
repository = "https://github.com/fluxeniteab/notecraft"
readme = "README.md"

[dependencies]
eframe = { version = "0.31", default-features = true }
egui = "0.31"
pulldown-cmark = "0.12"
syntect = "5.2"
notify = "6"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
chrono = "0.4"
walkdir = "2"
tempfile = "3"
regex = "1"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
serde_yaml = "0.9"
image = "0.25"

[profile.release]
opt-level = 3
lto = true

[dev-dependencies]
tempfile = "3"

[[test]]
name = "vault_tests"
path = "tests/vault_tests.rs"

[[test]]
name = "markdown_tests"
path = "tests/markdown_tests.rs"

[[test]]
name = "search_tests"
path = "tests/search_tests.rs"

[[test]]
name = "storage_tests"
path = "tests/storage_tests.rs"
